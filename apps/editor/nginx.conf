server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Cache-Control "no-cache" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://api.plantini.eu https://auth.plantini.eu http://127.0.0.1:1338 http://127.0.0.1:8082; img-src 'self' data: https://api.plantini.eu http://127.0.0.1:1338; frame-ancestors 'none'; base-uri 'none'; form-action 'self' https://auth.plantini.eu http://127.0.0.1:8082" always;
  location = /healthz { default_type text/plain; return 200 'ok'; }
  location / { try_files $uri $uri/ /index.html; }
}
