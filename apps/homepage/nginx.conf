server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  include /etc/nginx/plantini-headers.conf;

  error_page 404 /404.html;

  location = /healthz {
    include /etc/nginx/plantini-headers.conf;
    default_type text/plain;
    return 200 'ok';
  }

  # Hashed build output: cache for a year.
  location /assets/ {
    include /etc/nginx/plantini-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Photos and 3D modules keep their names: revalidate daily.
  location ~ ^/(photos|worlds)/ {
    include /etc/nginx/plantini-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # A replacement service worker must never be cached.
  location = /flutter_service_worker.js {
    include /etc/nginx/plantini-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # The app's login return: served without a directory redirect so the query
  # (code, state) reaches the page and Android's App Link sees the exact URL.
  location = /app/login {
    include /etc/nginx/plantini-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files /app/login/index.html =404;
  }

  location / {
    include /etc/nginx/plantini-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}
