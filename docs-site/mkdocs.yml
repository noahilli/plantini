site_name: Plantini Handbuch
site_description: Das Entwickler-, Betriebs- und Redaktionshandbuch der Lernplattform Plantini.
site_author: Noah Illmann
docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true

theme:
  name: material
  custom_dir: overrides
  language: de
  # Fonts are self-hosted (Caprasimo + Figtree, SIL OFL), see assets/stylesheets/plantini.css.
  font: false
  logo: assets/img/logo.svg
  favicon: assets/img/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: plantini
      toggle:
        icon: material/weather-night
        name: Dunkles Design
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Helles Design
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/stylesheets/plantini.css
extra_javascript:
  - assets/javascripts/mermaid.min.js

extra:
  generator: false

plugins:
  - search:
      lang: de
  - glightbox:
      touchNavigation: true
      loop: false
      zoomable: true
      draggable: false
  - privacy:
      enabled: false
hooks:
  - hooks/generate_reference.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark

