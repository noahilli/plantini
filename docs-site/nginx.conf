# Handbuch: statisch, hinter Basic Auth. TLS und Host-Routing übernimmt Caddy (infra/production/Caddyfile);
# der Container lauscht nur auf Loopback. Fehlt die Passwortdatei, antwortet nginx mit 500 statt offen zu sein.
limit_req_zone $binary_remote_addr zone=docs_auth:1m rate=10r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "private, no-cache" always;

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        auth_basic "Plantini Handbuch";
        auth_basic_user_file /etc/nginx/htpasswd/docs.htpasswd;
        limit_req zone=docs_auth burst=30 nodelay;
        try_files $uri $uri/ =404;
    }
}
