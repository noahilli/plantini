stages:
  - lint
  - test
  - build
  - integration

variables:
  DOCKER_DRIVER: overlay2
  FLUTTER_VERSION: "3.24.5"

# ── Flutter Stage ──────────────────────────────────────────────────
flutter:analyze_and_test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:${FLUTTER_VERSION}
  script:
    - cd apps/flutter
    - flutter pub get
    - flutter analyze
    - flutter test

flutter:build_web:
  stage: build
  image: ghcr.io/cirruslabs/flutter:${FLUTTER_VERSION}
  script:
    - cd apps/flutter
    - flutter pub get
    - flutter build web
  artifacts:
    paths:
      - apps/flutter/build/web/
    expire_in: 1 week

# ── Backend & OpenAPI Stage ────────────────────────────────────────
backend:test:
  stage: test
  image: node:20-alpine
  script:
    - cd services/platform
    - npm ci
    - npm test
    - cd ../..
    - node --test services/identity/test/*.test.mjs

# ── E2E Integration ────────────────────────────────────────────────
e2e:playwright:
  stage: integration
  image: mcr.microsoft.com/playwright:v1.40.0-jammy
  services:
    - docker:dind
  script:
    - cd tools/e2e
    - npm ci
    - npx playwright test
  artifacts:
    when: always
    paths:
      - tools/e2e/playwright-report/
    expire_in: 1 week
