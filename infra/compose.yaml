name: plantini

services:
  postgres-platform:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plantini
      POSTGRES_USER: plantini
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:-dummy_db_password}
    volumes:
      - platform-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantini -d plantini"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-keycloak:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-dummy_keycloak_password}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dummy_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dummy_minio_password}
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000 || exit 1'"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.11
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/info || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  plantnet-mock:
    image: mockserver/mockserver:5.15.0
    ports:
      - "1080:1080"
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-dummy_keycloak_password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_BOOTSTRAP_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_PASSWORD:-admin}
      KC_HEALTH_ENABLED: 'true'
    ports:
      - "8082:8080"
    volumes:
      - ../services/identity/realm:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  platform:
    image: node:20-alpine
    working_dir: /opt/app
    command: >
      sh -c "
      if [ -f package.json ]; then
        npm run develop;
      else
        echo 'Empty Strapi volume. Waiting for CMS Manager to initialize Strapi...';
        sleep infinity;
      fi
      "
    depends_on:
      postgres-platform:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      NODE_ENV: development
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres-platform
      DATABASE_PORT: '5432'
      DATABASE_NAME: plantini
      DATABASE_USERNAME: plantini
      DATABASE_PASSWORD: ${PLATFORM_DB_PASSWORD:-dummy_db_password}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-dummy_minio_user}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dummy_minio_password}
      OIDC_ISSUER: http://keycloak:8080/realms/plantini
      PLATFORM_OIDC_ISSUER: http://keycloak:8080/realms/plantini
      PLATFORM_OIDC_AUDIENCE: plantini-api
      PLATFORM_OIDC_ROLE_CLIENT_ID: plantini-api
      PLANTNET_BASE_URL: http://plantnet-mock:1080
      PLANTNET_API_KEY: local-mock-only
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      APP_KEYS: ${STRAPI_APP_KEYS:-key1,key2}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT:-salt}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET:-secret}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT:-salt}
      JWT_SECRET: ${STRAPI_JWT_SECRET:-secret}
    ports:
      - "1338:1337"
    volumes:
      - ../services/platform:/opt/app
      - platform-node-modules:/opt/app/node_modules
    healthcheck:
      test: >
        sh -c "
        if [ -f package.json ]; then
          wget -qO- http://localhost:1337/_health || exit 1;
        else
          exit 0;
        fi
        "
      interval: 10s
      timeout: 5s
      retries: 5

  playwright:
    image: mcr.microsoft.com/playwright:v1.40.0-jammy
    profiles:
      - tools
    working_dir: /work
    command: ["bash", "-lc", "npm ci && npx playwright test"]
    environment:
      PLATFORM_URL: http://platform:1337
      KEYCLOAK_URL: http://keycloak:8080
      MAILPIT_URL: http://mailpit:8025
    volumes:
      - ../tools/e2e:/work
    depends_on:
      platform:
        condition: service_started
      keycloak:
        condition: service_started

volumes:
  platform-db:
  keycloak-db:
  redis-data:
  object-data:
  platform-node-modules:
