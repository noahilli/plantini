name: Plantini CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── 1. API Contract & Backend Validation ─────────────────────────
  backend-and-contracts:
    name: Backend & API Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/platform/package-lock.json

      - name: Validate OpenAPI Contract
        run: |
          npx @redocly/cli lint contracts/api.yaml

      - name: Install Platform Dependencies
        run: |
          cd services/platform && npm ci

      - name: Run Backend Unit Tests
        run: |
          cd services/platform && npm test

      - name: Run Identity Realm Security Tests
        run: |
          node --test services/identity/test/*.test.mjs

  # ── 2. Flutter Mobile, Web & Desktop Test & Build ────────────────
  flutter-test-and-build:
    name: Flutter Lint, Tests & Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd apps/flutter && flutter pub get

      - name: Run Flutter Static Analysis
        run: |
          cd apps/flutter && flutter analyze

      - name: Run Unit & Widget Tests
        run: |
          cd apps/flutter && flutter test

      - name: Build Flutter Web
        run: |
          cd apps/flutter && flutter build web

      - name: Build Linux Desktop
        run: |
          cd apps/flutter && ./tool/build-linux.sh
        env:
          PLANTINI_ENV: development
          PLANTINI_API_BASE_URL: http://127.0.0.1:1338/api/v1
          PLANTINI_OIDC_ISSUER_URL: http://127.0.0.1:8082/realms/plantini
          PLANTINI_OIDC_CLIENT_ID: plantini-mobile-dev

  # ── 3. End-to-End Playwright Tests ───────────────────────────────
  e2e-integration-tests:
    name: E2E Integration Suite
    runs-on: ubuntu-latest
    needs: [backend-and-contracts, flutter-test-and-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tools/e2e/package-lock.json

      - name: Setup Flutter for the isolated E2E web build
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install Playwright & Test Dependencies
        working-directory: tools/e2e
        run: |
          npm ci
          npm run install:browsers:ci

      - name: Start isolated IPv4 E2E stack
        working-directory: tools/e2e
        run: npm run stack:up
        env:
          PLANTINI_E2E_FLUTTER_VERSION: '3.47.1'

      - name: Run Playwright E2E Tests
        working-directory: tools/e2e
        run: npm test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            tools/e2e/.runtime/playwright-report/
            tools/e2e/.runtime/test-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Tear down isolated IPv4 E2E stack
        if: always()
        working-directory: tools/e2e
        run: |
          if [ -f .runtime/e2e.env ]; then
            npm run stack:down
          fi
