openapi: 3.1.0
info:
  title: Plantini Platform API
  version: 1.0.0-draft.1
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    Kanonischer Vertrag zwischen Plantini-App und Fach-API. Die App kommuniziert
    niemals direkt mit Strapi oder einem Identifikationsprovider. Alle schreibenden
    Aufrufe sind über Idempotency-Key oder clientEventId wiederholbar.
servers:
  - url: http://127.0.0.1:1338/api/v1
    description: IPv4 development default; generated clients override this per environment
security:
  - bearerAuth: []
x-plantini-api-conventions:
  version: v1
  versionHeader: X-API-Version
  correlationHeader: X-Correlation-Id
  errorMediaType: application/problem+json
  pagination: {pageParameter: page, pageSizeParameter: pageSize, maximumPageSize: 100}
  timestamps: RFC3339 UTC on output; timezone required on input
  idempotency: Idempotency-Key is required on retryable command operations
tags:
  - name: Profile
    description: Authenticated person and preferences.
  - name: Content
    description: Published, versioned botanical content.
  - name: Learning
    description: Server-authoritative learning attempts and progress.
  - name: Field
    description: Private media and asynchronous identification jobs.
  - name: Herbarium
    description: Caller-owned private observations.
paths:
  /me:
    get:
      summary: Read the authenticated profile
      tags: [Profile]
      operationId: getMe
      responses:
        '200': {description: Authenticated profile, content: {application/json: {schema: {$ref: '#/components/schemas/UserProfile'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      summary: Update permitted profile preferences
      tags: [Profile]
      operationId: updateMe
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateProfileRequest'}}}
      responses:
        '200': {description: Updated profile, content: {application/json: {schema: {$ref: '#/components/schemas/UserProfile'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /content/manifest:
    get:
      summary: Read the active immutable content manifest
      tags: [Content]
      operationId: getContentManifest
      security: []
      parameters:
        - {$ref: '#/components/parameters/IfNoneMatch'}
      responses:
        '200': {description: Immutable active content release, content: {application/json: {schema: {$ref: '#/components/schemas/ContentManifest'}}}}
        '304': {description: Previously downloaded release is current}
        '400': {$ref: '#/components/responses/BadRequest'}
  /content/changes:
    get:
      summary: Read released content changes and deletion tombstones
      tags: [Content]
      operationId: getContentChanges
      security: []
      parameters:
        - name: since
          in: query
          required: false
          schema: {type: string}
      responses:
        '200': {description: Incremental release changes, content: {application/json: {schema: {$ref: '#/components/schemas/ContentChangePage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /ecosystems:
    get:
      summary: List published ecosystems
      tags: [Content]
      operationId: listEcosystems
      security: []
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Published ecosystems only, content: {application/json: {schema: {$ref: '#/components/schemas/EcosystemPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /ecosystems/{ecosystemId}:
    get:
      summary: Read one published ecosystem
      tags: [Content]
      operationId: getEcosystem
      security: []
      parameters: [{$ref: '#/components/parameters/EcosystemId'}]
      responses:
        '200': {description: Published ecosystem, content: {application/json: {schema: {$ref: '#/components/schemas/Ecosystem'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /ecosystems/{ecosystemId}/progress:
    get:
      summary: Compute the actor's ecosystem completion from passed levels and collected species
      description: >-
        Read-only authoritative snapshot. Collection can precede any quiz. All quiz
        levels remain passable without collection when collectionScope is ecosystem.
        A deleted herbarium record no longer counts; duplicates and foreign species
        do not satisfy additional targets. No completion mutation is required.
      tags: [Learning]
      operationId: getEcosystemProgress
      parameters: [{$ref: '#/components/parameters/EcosystemId'}]
      responses:
        '200': {description: Authoritative ecosystem completion, content: {application/json: {schema: {$ref: '#/components/schemas/EcosystemProgress'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {description: Collection or content validation unavailable, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /levels/{levelId}:
    get:
      summary: Read an accessible level and its user state
      tags: [Content]
      operationId: getLevel
      parameters: [{$ref: '#/components/parameters/LevelId'}]
      responses:
        '200': {description: Level and caller-specific access state, content: {application/json: {schema: {$ref: '#/components/schemas/Level'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /plants/{plantId}:
    get:
      summary: Read one published plant profile
      tags: [Content]
      operationId: getPlant
      security: []
      parameters: [{$ref: '#/components/parameters/PlantId'}]
      responses:
        '200': {description: Published plant profile, content: {application/json: {schema: {$ref: '#/components/schemas/Plant'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /plants/{plantId}/photo:
    get:
      summary: Read an attributed supplemental photo for a published plant
      description: Without photoId the primary supplemental photo is returned. The plant profile lists up to ten photos (authored first) whose URLs carry the photoId of each supplemental photo.
      tags: [Content]
      operationId: getPlantPhoto
      security: []
      parameters:
        - {$ref: '#/components/parameters/PlantId'}
        - name: photoId
          in: query
          required: false
          description: Identifier of one supplemental photo of this plant, as referenced by the plant profile media URL.
          schema: {type: string, minLength: 1, maxLength: 64}
      responses:
        '200':
          description: Same-origin cached image. Attribution and license are in the plant profile.
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {description: Image provider or cache temporarily unavailable}
  /media/{mediaId}/content:
    get:
      summary: Read one of the caller's own uploaded photos
      description: Owner-scoped; another account's media id is indistinguishable from a missing one. The bytes behind an id never change, so the response is immutable and clients cache it for good. `width` returns a resized JPEG (longest side) for thumbnails.
      tags: [Herbarium]
      operationId: getPrivateMediaContent
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Id'}
        - name: width
          in: query
          required: false
          schema: {type: integer, enum: [320, 720, 1280]}
      responses:
        '200':
          description: The photo (or its resized JPEG variant).
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '304': {description: Not modified}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /tiles/{z}/{x}/{y}:
    get:
      summary: Map tile for the herbarium map
      description: OpenStreetMap tile, fetched and cached by the server so the app never contacts the tile provider. Requires a signed-in user (the endpoint is not an open proxy). Zoom 0-18.
      tags: [Herbarium]
      operationId: getMapTile
      parameters:
        - {name: z, in: path, required: true, schema: {type: integer, minimum: 0, maximum: 18}}
        - {name: x, in: path, required: true, schema: {type: integer, minimum: 0}}
        - {name: y, in: path, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: PNG tile, content: {image/png: {schema: {type: string, format: binary}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {description: The tile provider is unavailable and no cached copy exists, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /species/{speciesKey}:
    get:
      summary: Info card of a species found by users that is not part of any ecosystem
      description: Built once from public sources and cached for all users. Never listed in ecosystems or levels.
      tags: [Herbarium]
      operationId: getSpeciesCard
      parameters:
        - name: speciesKey
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z0-9-]{2,120}$'}
      responses:
        '200': {description: The species card, content: {application/json: {schema: {$ref: '#/components/schemas/SpeciesCard'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /species/{speciesKey}/photo:
    get:
      summary: Photo of a species card (server-side cached copy)
      tags: [Herbarium]
      operationId: getSpeciesPhoto
      parameters:
        - {name: speciesKey, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9-]{2,120}$'}}
        - {name: photoId, in: query, required: false, schema: {type: string, maxLength: 64}, description: Identifier from the card; makes the response immutable.}
      responses:
        '200':
          description: The photo
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /stats/collection:
    get:
      summary: Share of accounts that collected each plant or species
      description: Aggregated over all accounts. Below a minimum number of accounts no shares are published (`available` is false). Shares are shown in per cent, or in per mille below one per cent.
      tags: [Herbarium]
      operationId: getCollectionStats
      responses:
        '200': {description: Collection shares, content: {application/json: {schema: {$ref: '#/components/schemas/CollectionStats'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /quiz-items:
    get:
      summary: List quiz items for a level and content version
      tags: [Learning]
      operationId: listQuizItems
      parameters:
        - name: levelId
          in: query
          required: true
          schema: {$ref: '#/components/schemas/Id'}
        - name: contentVersion
          in: query
          required: false
          schema: {type: string}
      responses:
        '200': {description: Quiz items in an immutable order-neutral package, content: {application/json: {schema: {$ref: '#/components/schemas/QuizItemPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /level-attempts:
    post:
      summary: Start or resume an idempotent level attempt
      description: Missing requiredLevelIds returns 409 LEVEL_LOCKED. Passed levels permit revisits; failed attempts can be retried using a new clientAttemptId.
      tags: [Learning]
      operationId: startLevelAttempt
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/StartLevelAttemptRequest'}}}
      responses:
        '200': {description: Idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/LevelAttempt'}}}}
        '201': {description: New or resumed attempt, content: {application/json: {schema: {$ref: '#/components/schemas/LevelAttempt'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /level-attempts/{attemptId}/complete:
    post:
      summary: Complete an attempt with server-side scoring
      tags: [Learning]
      operationId: completeLevelAttempt
      parameters:
        - {$ref: '#/components/parameters/AttemptId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CompleteLevelAttemptRequest'}}}
      responses:
        '200': {description: Server-authoritative completion, content: {application/json: {schema: {$ref: '#/components/schemas/LevelCompletion'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /learning-events/batch:
    post:
      summary: Submit idempotent offline learning events
      tags: [Learning]
      operationId: submitLearningEvents
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LearningEventBatch'}}}
      responses:
        '200': {description: Every accepted client event is acknowledged exactly once, content: {application/json: {schema: {$ref: '#/components/schemas/EventBatchAck'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /progress:
    get:
      summary: Read server-authoritative learning progress
      tags: [Learning]
      operationId: getProgress
      parameters:
        - name: since
          in: query
          schema: {type: string, format: date-time}
      responses:
        '200': {description: Authoritative progress materialization, content: {application/json: {schema: {$ref: '#/components/schemas/ProgressSnapshot'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /achievements:
    get:
      x-plantini-implementation-status: planned
      summary: List earned and next learning achievements
      tags: [Learning]
      operationId: listAchievements
      responses:
        '200': {description: Caller achievement state, content: {application/json: {schema: {$ref: '#/components/schemas/AchievementPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /sync:
    post:
      summary: Synchronize a bounded offline event batch and progress cursor
      tags: [Learning]
      operationId: synchronize
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SyncRequest'}}}
      responses:
        '200': {description: Synchronization acknowledgement and canonical progress, content: {application/json: {schema: {$ref: '#/components/schemas/SyncResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /media/uploads:
    post:
      summary: Reserve a private media upload
      tags: [Field]
      operationId: createMediaUpload
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateUploadRequest'}}}
      responses:
        '200': {description: Existing private upload reservation replayed for the same idempotency key, content: {application/json: {schema: {$ref: '#/components/schemas/MediaUpload'}}}}
        '201': {description: Private upload reservation, content: {application/json: {schema: {$ref: '#/components/schemas/MediaUpload'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /media/uploads/{mediaId}/content:
    post:
      summary: Upload bytes to a caller-owned short-lived media reservation
      tags: [Field]
      operationId: uploadPrivateMediaContent
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Id'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: {type: string, format: binary}
      responses:
        '200': {description: Private bytes stored after media-type and size verification, content: {application/json: {schema: {$ref: '#/components/schemas/MediaUpload'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /identifications:
    post:
      summary: Create an asynchronous identification job
      tags: [Field]
      operationId: createIdentification
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateIdentificationRequest'}}}
      responses:
        '200': {description: Existing identification job replayed for the same idempotency key, content: {application/json: {schema: {$ref: '#/components/schemas/IdentificationJob'}}}}
        '202': {description: Persisted asynchronous job, content: {application/json: {schema: {$ref: '#/components/schemas/IdentificationJob'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /identifications/{jobId}:
    get:
      summary: Read a caller-owned identification job
      tags: [Field]
      operationId: getIdentification
      parameters: [{$ref: '#/components/parameters/JobId'}]
      responses:
        '200': {description: Caller-owned identification status, content: {application/json: {schema: {$ref: '#/components/schemas/IdentificationJob'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /identifications/{jobId}/retry:
    post:
      summary: Schedule a controlled identification retry
      tags: [Field]
      operationId: retryIdentification
      parameters:
        - {$ref: '#/components/parameters/JobId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {description: Retry scheduled, content: {application/json: {schema: {$ref: '#/components/schemas/IdentificationJob'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /identifications/{jobId}/confirm:
    post:
      summary: Confirm one candidate before it can enter the private herbarium
      tags: [Field]
      operationId: confirmIdentification
      parameters: [{$ref: '#/components/parameters/JobId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ConfirmIdentificationRequest'}}}
      responses:
        '200': {description: Caller-confirmed identification, content: {application/json: {schema: {$ref: '#/components/schemas/IdentificationJob'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /observations:
    get:
      summary: List caller-owned herbarium observations
      tags: [Herbarium]
      operationId: listObservations
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Caller-owned observations, content: {application/json: {schema: {$ref: '#/components/schemas/ObservationPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      summary: Create an idempotent private observation
      tags: [Herbarium]
      operationId: createObservation
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateObservationRequest'}}}
      responses:
        '200': {description: Existing private observation replayed for the same idempotency key, content: {application/json: {schema: {$ref: '#/components/schemas/Observation'}}}}
        '201': {description: Caller-owned observation, content: {application/json: {schema: {$ref: '#/components/schemas/Observation'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /observations/{observationId}:
    get:
      summary: Read one caller-owned observation
      tags: [Herbarium]
      operationId: getObservation
      parameters: [{$ref: '#/components/parameters/ObservationId'}]
      responses:
        '200': {description: Caller-owned observation, content: {application/json: {schema: {$ref: '#/components/schemas/Observation'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      summary: Update an observation with optimistic concurrency
      tags: [Herbarium]
      operationId: updateObservation
      parameters: [{$ref: '#/components/parameters/ObservationId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateObservationRequest'}}}
      responses:
        '200': {description: Updated observation, content: {application/json: {schema: {$ref: '#/components/schemas/Observation'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      summary: Create an observation tombstone
      tags: [Herbarium]
      operationId: deleteObservation
      parameters: [{$ref: '#/components/parameters/ObservationId'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '202': {description: Tombstone persisted; media deletion may continue asynchronously}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/content-releases:
    post:
      x-plantini-implementation-status: planned
      summary: Validate and publish a content release
      tags: [Content]
      operationId: createContentRelease
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateContentReleaseRequest'}}}
      responses:
        '202': {description: Release validation or publication job, content: {application/json: {schema: {$ref: '#/components/schemas/AdministrativeJob'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/imports:
    post:
      x-plantini-implementation-status: planned
      summary: Validate or import versioned editorial data
      tags: [Content]
      operationId: createImport
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateImportRequest'}}}
      responses:
        '202': {description: Import validation or execution job, content: {application/json: {schema: {$ref: '#/components/schemas/AdministrativeJob'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/dashboard:
    get:
      x-plantini-implementation-status: planned
      summary: Read privacy-preserving aggregated editorial metrics
      tags: [Content]
      operationId: getAdminDashboard
      responses:
        '200': {description: Aggregated metrics without personal content, content: {application/json: {schema: {$ref: '#/components/schemas/AdminDashboard'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/users:
    get:
      x-plantini-implementation-status: planned
      summary: Search authorized user administration records
      tags: [Profile]
      operationId: listAdminUsers
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Minimal authorized user representation, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/users/{userId}/suspend:
    post:
      x-plantini-implementation-status: planned
      summary: Suspend a user and revoke active sessions
      tags: [Profile]
      operationId: suspendUser
      parameters: [{$ref: '#/components/parameters/UserId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {description: Suspension job, content: {application/json: {schema: {$ref: '#/components/schemas/AdministrativeJob'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /privacy/exports:
    post:
      x-plantini-implementation-status: planned
      summary: Request a caller's machine-readable data export
      tags: [Profile]
      operationId: createPrivacyExport
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {description: Export job, content: {application/json: {schema: {$ref: '#/components/schemas/AdministrativeJob'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /privacy/deletions:
    post:
      x-plantini-implementation-status: planned
      summary: Request caller account deletion
      tags: [Profile]
      operationId: createPrivacyDeletion
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {description: Deletion job, content: {application/json: {schema: {$ref: '#/components/schemas/AdministrativeJob'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string}}
    IfNoneMatch: {name: If-None-Match, in: header, required: false, schema: {type: string}}
    Page: {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    EcosystemId: {name: ecosystemId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    LevelId: {name: levelId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    PlantId: {name: plantId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    AttemptId: {name: attemptId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    JobId: {name: jobId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ObservationId: {name: observationId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    UserId: {name: userId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
  headers:
    CorrelationId: {description: Stable request trace identifier, schema: {type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$'}}
    ApiVersion: {description: Served major API boundary, schema: {type: string, enum: [v1]}}
  responses:
    BadRequest: {description: Request violates a documented input invariant, headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}, X-API-Version: {$ref: '#/components/headers/ApiVersion'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Unauthorized: {description: 'Missing, expired or invalid bearer token', headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}, X-API-Version: {$ref: '#/components/headers/ApiVersion'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    NotFound: {description: Resource is unavailable to this caller, headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}, X-API-Version: {$ref: '#/components/headers/ApiVersion'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Conflict: {description: 'Version, idempotency or state conflict', headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}, X-API-Version: {$ref: '#/components/headers/ApiVersion'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Forbidden: {description: Caller does not have the required role or scope, headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}, X-API-Version: {$ref: '#/components/headers/ApiVersion'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  schemas:
    Id: {type: string, format: uuid}
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        traceId: {type: string}
        fieldErrors: {type: object, additionalProperties: {type: string}}
    UserProfile:
      type: object
      required: [id, displayName, roles, locale]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        displayName: {type: string}
        locale: {type: string, example: de-DE}
        roles: {type: array, items: {type: string, enum: [lernende, lehrende, inhaltsredaktion, botanisches_review, organisationsadministration, systemadministration]}}
        organisationId: {$ref: '#/components/schemas/Id'}
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties: {displayName: {type: string, minLength: 1, maxLength: 100}, locale: {type: string, maxLength: 35}}
    ContentManifest:
      type: object
      required: [version, releasedAt, schemaVersion, minimumAppVersion, packages]
      properties:
        version: {type: string}
        releasedAt: {type: string, format: date-time}
        schemaVersion: {type: string}
        minimumAppVersion: {type: string}
        signature: {type: string}
        packages: {type: array, items: {$ref: '#/components/schemas/ContentPackage'}}
    ContentPackage:
      type: object
      required: [id, url, sha256, bytes]
      properties:
        id: {type: string}
        url: {type: string, format: uri}
        sha256: {type: string, pattern: '^[a-fA-F0-9]{64}$'}
        bytes: {type: integer, minimum: 0}
    ContentChangePage:
      type: object
      required: [cursor, changes]
      properties:
        cursor: {type: string}
        changes: {type: array, items: {$ref: '#/components/schemas/ContentChange'}}
    ContentChange:
      type: object
      required: [entity, id, operation, version]
      properties:
        entity: {type: string, enum: [ecosystem, level, plant, quiz_item, media]}
        id: {$ref: '#/components/schemas/Id'}
        operation: {type: string, enum: [upsert, delete]}
        version: {type: string}
    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties: {page: {type: integer}, pageSize: {type: integer}, total: {type: integer}}
    Ecosystem:
      type: object
      required: [id, slug, name, releaseVersion]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        slug: {type: string}
        name: {type: string}
        description: {type: string}
        releaseVersion: {type: string}
        levelIds: {type: array, items: {$ref: '#/components/schemas/Id'}}
    EcosystemPage:
      type: object
      required: [items, page]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Ecosystem'}}, page: {$ref: '#/components/schemas/PageMeta'}}
    Level:
      type: object
      required: [id, ecosystemId, title, sequence, completionRule, status]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        ecosystemId: {$ref: '#/components/schemas/Id'}
        title: {type: string}
        sequence: {type: integer, minimum: 1}
        learningGoal: {type: string}
        plantIds: {type: array, items: {$ref: '#/components/schemas/Id'}}
        completionRule: {$ref: '#/components/schemas/CompletionRule'}
        status: {type: string, enum: [locked, available, in_progress, completed]}
        progress: {type: number, minimum: 0, maximum: 1}
    CompletionRule:
      type: object
      required: [minimumScore]
      properties:
        minimumScore: {type: number, minimum: 0, maximum: 1}
        requiredQuizIds: {type: array, items: {$ref: '#/components/schemas/Id'}}
        requiredLevelIds: {type: array, items: {$ref: '#/components/schemas/Id'}}
        requiredPlantIds:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Id'}
          description: Explicit collection targets. Ecosystem-scoped ordinary levels return []; only the final level lists the three public UUIDs. Clients must not infer targets from plantIds.
        collectionScope:
          type: string
          enum: [level, ecosystem]
          default: level
          description: Legacy rules default to level and retain their per-level collection gate. Ecosystem rules never block quiz completion; GET ecosystem progress evaluates the final collection gate.
    EcosystemProgress:
      type: object
      required: [ecosystemId, status, completed, totalLevels, completedLevelCount, completedLevelIds, requiredPlantIds, collectedPlantIds, missingPlantIds]
      properties:
        ecosystemId: {$ref: '#/components/schemas/Id'}
        status: {type: string, enum: [in_progress, collection_pending, completed]}
        completed: {type: boolean, description: True only when every published level has a server-passed attempt and every target species is collected.}
        totalLevels: {type: integer, minimum: 1}
        completedLevelCount: {type: integer, minimum: 0}
        completedLevelIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Id'}, description: Passed level IDs in sequence order.}
        requiredPlantIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Id'}}
        collectedPlantIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Id'}, description: Distinct collected required species only.}
        missingPlantIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Id'}}
    Plant:
      type: object
      required: [id, scientificName, releaseVersion]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        slug: {type: string}
        scientificName: {type: string}
        commonName: {type: string}
        family: {type: string}
        description: {type: string}
        warning: {type: string}
        sources: {type: array, items: {type: string, format: uri}}
        profileCards:
          type: array
          description: Readable CMS-authored lesson sections. Does not include quiz solution keys. Absent in older releases.
          items:
            type: object
            required: [heading, text]
            properties:
              heading: {type: string}
              text: {type: string}
        media: {type: array, items: {$ref: '#/components/schemas/PublicMedia'}}
        releaseVersion: {type: string}
    PublicMedia:
      type: object
      required: [id, url, altText, license, author]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        url: {type: string, format: uri}
        altText: {type: string}
        license: {type: string}
        author: {type: string}
        source: {type: string, format: uri, description: Original image description and attribution page}
        licenseUrl: {type: string, format: uri}
        automatic: {type: boolean, default: false, description: Supplemental provider image not editorially reviewed or part of the immutable release}
    QuizItem:
      type: object
      required: [id, levelId, type, contentVersion, prompt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        levelId: {$ref: '#/components/schemas/Id'}
        type: {type: string, enum: [multiple_choice, flashcard, image_identification, feature_match]}
        contentVersion: {type: string}
        prompt: {type: string}
        choices: {type: array, items: {$ref: '#/components/schemas/QuizChoice'}}
    QuizChoice:
      type: object
      required: [id, label]
      properties: {id: {type: string}, label: {type: string}}
    QuizItemPage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/QuizItem'}}}
    StartLevelAttemptRequest:
      type: object
      required: [levelId, clientAttemptId, contentVersion]
      properties: {levelId: {$ref: '#/components/schemas/Id'}, clientAttemptId: {$ref: '#/components/schemas/Id'}, contentVersion: {type: string}}
    LevelAttempt:
      type: object
      required: [id, levelId, status, contentVersion]
      properties: {id: {$ref: '#/components/schemas/Id'}, levelId: {$ref: '#/components/schemas/Id'}, status: {type: string, enum: [active, completed, expired]}, contentVersion: {type: string}, startedAt: {type: string, format: date-time}}
    CompleteLevelAttemptRequest:
      type: object
      required: [clientEventId, answers]
      properties: {clientEventId: {$ref: '#/components/schemas/Id'}, answers: {type: array, minItems: 1, items: {$ref: '#/components/schemas/QuizAnswer'}}}
    QuizAnswer:
      type: object
      required: [quizItemId, choiceId]
      properties: {quizItemId: {$ref: '#/components/schemas/Id'}, choiceId: {type: string}}
    LevelCompletion:
      type: object
      required: [attemptId, passed, score, status]
      properties: {attemptId: {$ref: '#/components/schemas/Id'}, passed: {type: boolean}, score: {type: number}, status: {type: string, enum: [completed, failed]}, progress: {$ref: '#/components/schemas/ProgressSnapshot'}}
    LearningEventBatch:
      type: object
      required: [events]
      properties: {events: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/LearningEvent'}}}
    LearningEvent:
      type: object
      required: [clientEventId, type, occurredAt, payloadVersion]
      properties: {clientEventId: {$ref: '#/components/schemas/Id'}, type: {type: string}, occurredAt: {type: string, format: date-time}, payloadVersion: {type: integer, minimum: 1}, payload: {type: object}}
    EventBatchAck:
      type: object
      required: [acceptedClientEventIds]
      properties: {acceptedClientEventIds: {type: array, items: {$ref: '#/components/schemas/Id'}}, rejected: {type: array, items: {$ref: '#/components/schemas/Problem'}}}
    ProgressSnapshot:
      type: object
      required: [updatedAt, levels]
      properties: {updatedAt: {type: string, format: date-time}, levels: {type: array, items: {$ref: '#/components/schemas/LevelProgress'}}}
    LevelProgress:
      type: object
      required: [levelId, status, percentage]
      properties: {levelId: {$ref: '#/components/schemas/Id'}, status: {type: string, enum: [locked, available, in_progress, completed]}, percentage: {type: number, minimum: 0, maximum: 1}, completedAt: {type: string, format: date-time}}
    AchievementPage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Achievement'}}}
    Achievement:
      type: object
      required: [id, status, title]
      properties: {id: {type: string}, status: {type: string, enum: [earned, next, locked]}, title: {type: string}, description: {type: string}, earnedAt: {type: string, format: date-time}}
    SyncRequest:
      type: object
      required: [events]
      properties: {events: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/LearningEvent'}}, contentCursor: {type: string}}
    SyncResponse:
      type: object
      required: [progress, acknowledgedClientEventIds]
      properties: {progress: {$ref: '#/components/schemas/ProgressSnapshot'}, acknowledgedClientEventIds: {type: array, items: {$ref: '#/components/schemas/Id'}}, contentCursor: {type: string}}
    CreateUploadRequest:
      type: object
      required: [clientMediaId, contentType, bytes]
      properties: {clientMediaId: {$ref: '#/components/schemas/Id'}, contentType: {type: string, enum: [image/jpeg, image/png]}, bytes: {type: integer, minimum: 1, maximum: 20971520}}
    MediaUpload:
      type: object
      required: [id, expiresAt, status]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        uploadUrl: {type: string, format: uri, description: Present only while the reservation is writable.}
        expiresAt: {type: string, format: date-time}
        status: {type: string, enum: [reserved, uploaded]}
    CreateIdentificationRequest:
      type: object
      required: [clientJobId, mediaId]
      properties: {clientJobId: {$ref: '#/components/schemas/Id'}, mediaId: {$ref: '#/components/schemas/Id'}, expectedPlantId: {$ref: '#/components/schemas/Id'}}
    IdentificationJob:
      type: object
      required: [id, status, createdAt, attempts]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        status: {type: string, enum: [pending, processing, identified, failed, cancelled]}
        createdAt: {type: string, format: date-time}
        attempts: {type: integer, minimum: 0}
        retryAfter: {type: string, format: date-time}
        candidates: {type: array, items: {$ref: '#/components/schemas/IdentificationCandidate'}}
        providerMetadata: {$ref: '#/components/schemas/IdentificationProviderMetadata'}
        expectedPlantId: {$ref: '#/components/schemas/Id'}
        expectedMatch: {type: string, enum: [matched, mismatch]}
        expectedCandidateId: {type: string, minLength: 3, maxLength: 160}
        failureCode: {type: string}
        deadLetteredAt: {type: string, format: date-time}
        confirmedPlantId: {$ref: '#/components/schemas/Id'}
        confirmedCandidateId: {type: string, minLength: 3, maxLength: 160}
    IdentificationCandidate:
      type: object
      required: [candidateId, scientificName, score]
      properties: {candidateId: {type: string, minLength: 3, maxLength: 160}, plantId: {$ref: '#/components/schemas/Id'}, scientificName: {type: string}, commonName: {type: string}, score: {type: number, minimum: 0, maximum: 1}, provider: {type: string}, modelVersion: {type: string}, safetyNotice: {type: string}}
    IdentificationProviderMetadata:
      type: object
      required: [provider, modelVersion, floraVersion]
      properties:
        provider: {type: string}
        modelVersion: {type: string}
        floraVersion: {type: string}
    ConfirmIdentificationRequest:
      type: object
      additionalProperties: false
      oneOf:
        - required: [candidateId]
        - required: [confirmedPlantId]
      properties: {candidateId: {type: string, minLength: 3, maxLength: 160}, confirmedPlantId: {$ref: '#/components/schemas/Id'}, acceptMismatch: {type: boolean, default: false}}
    CreateObservationRequest:
      type: object
      required: [clientObservationId, observedAt]
      properties: {clientObservationId: {$ref: '#/components/schemas/Id'}, observedAt: {type: string, format: date-time}, note: {type: string, maxLength: 4000}, mediaId: {$ref: '#/components/schemas/Id'}, identificationJobId: {$ref: '#/components/schemas/Id'}, location: {$ref: '#/components/schemas/PrivateLocation'}}
    UpdateObservationRequest:
      type: object
      additionalProperties: false
      properties: {note: {type: string, maxLength: 4000}, confirmedPlantId: {$ref: '#/components/schemas/Id'}}
    PrivateLocation:
      type: object
      required: [latitude, longitude, accuracyMeters]
      properties: {latitude: {type: number, minimum: -90, maximum: 90}, longitude: {type: number, minimum: -180, maximum: 180}, accuracyMeters: {type: number, minimum: 0}}
    Observation:
      type: object
      required: [id, clientObservationId, observedAt, version, syncStatus]
      properties: {id: {$ref: '#/components/schemas/Id'}, clientObservationId: {$ref: '#/components/schemas/Id'}, observedAt: {type: string, format: date-time}, note: {type: string}, confirmedPlantId: {$ref: '#/components/schemas/Id'}, speciesKey: {type: string, description: 'Set when the confirmed species is not in the catalogue; see /species/{speciesKey}.'}, speciesName: {type: string}, mediaId: {$ref: '#/components/schemas/Id'}, mediaUrl: {type: string, description: 'Path of the photo, see /media/{mediaId}/content.'}, location: {$ref: '#/components/schemas/ObservationLocation'}, identification: {$ref: '#/components/schemas/IdentificationJob'}, version: {type: string}, syncStatus: {type: string, enum: [synced, pending, conflict, deleted]}}
    ObservationLocation:
      type: object
      description: The find location as stored (coarsened by the client before upload). Only returned to the owner.
      required: [latitude, longitude]
      properties: {latitude: {type: number}, longitude: {type: number}, accuracyMeters: {type: number}}
    SpeciesCard:
      type: object
      required: [key, scientificName]
      properties:
        key: {type: string}
        scientificName: {type: string}
        commonName: {type: string}
        summary: {type: string}
        summaryLanguage: {type: string}
        summarySource: {type: string, description: 'Article the summary was taken from (Wikipedia).'}
        summaryLicense: {type: string}
        photo: {$ref: '#/components/schemas/PublicMedia'}
        collectedShare: {$ref: '#/components/schemas/CollectionShare'}
    CollectionShare:
      type: object
      required: [share, label]
      properties: {share: {type: number, minimum: 0, maximum: 1}, label: {type: string, description: 'Formatted, e.g. "12 %" or "3 ‰".'}}
    CollectionStats:
      type: object
      required: [available, generatedAt, plants, species]
      properties:
        available: {type: boolean}
        reason: {type: string}
        generatedAt: {type: string, format: date-time}
        plants: {type: object, additionalProperties: {$ref: '#/components/schemas/CollectionShare'}}
        species: {type: object, additionalProperties: {$ref: '#/components/schemas/CollectionShare'}}
    ObservationPage:
      type: object
      required: [items, page]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Observation'}}, page: {$ref: '#/components/schemas/PageMeta'}}
    CreateContentReleaseRequest:
      type: object
      required: [releaseVersion]
      properties: {releaseVersion: {type: string}, dryRun: {type: boolean, default: false}}
    CreateImportRequest:
      type: object
      required: [kind, sourceVersion]
      properties: {kind: {type: string, enum: [plants, quiz_items, translations]}, sourceVersion: {type: string}, dryRun: {type: boolean, default: true}}
    AdministrativeJob:
      type: object
      required: [id, status, createdAt]
      properties: {id: {$ref: '#/components/schemas/Id'}, status: {type: string, enum: [pending, processing, completed, failed]}, createdAt: {type: string, format: date-time}, failureCode: {type: string}}
    AdminDashboard:
      type: object
      required: [generatedAt, metrics]
      properties: {generatedAt: {type: string, format: date-time}, metrics: {type: object, additionalProperties: {type: number}}}
    AdminUserPage:
      type: object
      required: [items, page]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/AdminUser'}}, page: {$ref: '#/components/schemas/PageMeta'}}
    AdminUser:
      type: object
      required: [id, status, roles]
      properties: {id: {$ref: '#/components/schemas/Id'}, status: {type: string, enum: [active, suspended]}, roles: {type: array, items: {type: string}}, organisationId: {$ref: '#/components/schemas/Id'}}
